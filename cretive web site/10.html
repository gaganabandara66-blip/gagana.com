```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Web Designer</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
    height: 100vh;
    overflow: hidden;
}

header {
    height: 60px;
    background: #0f172a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    border-bottom: 1px solid #334155;
}

.logo {
    font-size: 20px;
    font-weight: bold;
    color: #38bdf8;
}

.buttons button {
    border: none;
    padding: 9px 14px;
    margin-left: 5px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.run {
    background: #22c55e;
    color: white;
}

.clear {
    background: #ef4444;
    color: white;
}

.download {
    background: #3b82f6;
    color: white;
}

.container {
    height: calc(100vh - 60px);
    display: grid;
    grid-template-columns: 50% 50%;
}

.editor {
    background: #020617;
    padding: 12px;
    overflow: auto;
}

.editor h3 {
    margin: 10px 0;
    color: #38bdf8;
}

textarea {
    width: 100%;
    height: 180px;
    background: #0f172a;
    color: #e2e8f0;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 12px;
    resize: vertical;
    outline: none;
    font-family: Consolas, monospace;
    font-size: 14px;
}

textarea:focus {
    border-color: #38bdf8;
}

.preview {
    background: white;
    color: black;
    border-left: 2px solid #334155;
}

.preview-title {
    height: 42px;
    background: #e2e8f0;
    display: flex;
    align-items: center;
    padding-left: 15px;
    color: #111827;
    font-weight: bold;
}

iframe {
    width: 100%;
    height: calc(100% - 42px);
    border: none;
}

@media (max-width: 800px) {

    body {
        overflow: auto;
    }

    .container {
        height: auto;
        display: block;
    }

    .editor {
        min-height: 650px;
    }

    .preview {
        height: 600px;
        border-left: none;
        border-top: 2px solid #334155;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        💻 My Web Designer
    </div>

    <div class="buttons">
        <button class="run" onclick="runCode()">▶ Run</button>
        <button class="clear" onclick="clearCode()">Clear</button>
        <button class="download" onclick="downloadCode()">⬇ Download</button>
    </div>

</header>


<div class="container">

    <!-- CODE EDITOR -->

    <div class="editor">

        <h3>HTML</h3>

        <textarea id="htmlCode">
<h1>Hello World!</h1>
<p>My First Website</p>
<button>Click Me</button>
        </textarea>


        <h3>CSS</h3>

        <textarea id="cssCode">
body {
    font-family: Arial;
    text-align: center;
    padding: 50px;
    background: #f1f5f9;
}

h1 {
    color: #2563eb;
}

p {
    font-size: 20px;
}

button {
    padding: 12px 25px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
}
        </textarea>


        <h3>JavaScript</h3>

        <textarea id="jsCode">
document.querySelector("button").onclick = function() {
    alert("Hello! Button clicked.");
};
        </textarea>

    </div>


    <!-- LIVE PREVIEW -->

    <div class="preview">

        <div class="preview-title">
            👁️ Live Preview
        </div>

        <iframe id="preview"></iframe>

    </div>

</div>


<script>

function runCode() {

    let html = document.getElementById("htmlCode").value;

    let css = document.getElementById("cssCode").value;

    let js = document.getElementById("jsCode").value;

    let output = `
        <!DOCTYPE html>
        <html>
        <head>
            <style>${css}</style>
        </head>

        <body>

            ${html}

            <script>
                ${js}
            <\/script>

        </body>
        </html>
    `;

    document.getElementById("preview").srcdoc = output;
}


// CLEAR

function clearCode() {

    document.getElementById("htmlCode").value = "";

    document.getElementById("cssCode").value = "";

    document.getElementById("jsCode").value = "";

    document.getElementById("preview").srcdoc = "";
}


// DOWNLOAD

function downloadCode() {

    let html = document.getElementById("htmlCode").value;

    let css = document.getElementById("cssCode").value;

    let js = document.getElementById("jsCode").value;

    let file = `
<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>My Website</title>

<style>

${css}

</style>

</head>

<body>

${html}

<script>

${js}

<\/script>

</body>

</html>
`;

    let blob = new Blob([file], {
        type: "text/html"
    });

    let url = URL.createObjectURL(blob);

    let a = document.createElement("a");

    a.href = url;

    a.download = "my-website.html";

    a.click();

    URL.revokeObjectURL(url);
}


// AUTO RUN

runCode();

</script>

</body>
</html>
```
