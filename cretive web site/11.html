<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gagana Design Studio</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#111827;
    color:white;
    overflow:hidden;
}

/* TOP BAR */

.topbar{
    height:60px;
    background:#0f172a;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    border-bottom:1px solid #334155;
}

.logo{
    font-size:20px;
    font-weight:bold;
    color:#38bdf8;
}

.top-buttons button{
    border:none;
    padding:9px 13px;
    margin-left:5px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.clear{
    background:#ef4444;
    color:white;
}

.download{
    background:#22c55e;
    color:white;
}

/* MAIN */

.main{
    height:calc(100vh - 60px);
    display:grid;
    grid-template-columns:210px 1fr 240px;
}

/* LEFT */

.sidebar{
    background:#0f172a;
    padding:15px;
    border-right:1px solid #334155;
}

.sidebar h3{
    margin-bottom:15px;
    color:#94a3b8;
}

.tool{
    width:100%;
    padding:12px;
    margin-bottom:9px;
    background:#1e293b;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    text-align:left;
}

.tool:hover{
    background:#334155;
}

/* WORK AREA */

.workspace{
    background:#1e293b;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:auto;
    padding:30px;
}

canvas{
    background:white;
    box-shadow:0 10px 35px rgba(0,0,0,.5);
    max-width:100%;
    max-height:100%;
}

/* RIGHT */

.properties{
    background:#0f172a;
    padding:18px;
    border-left:1px solid #334155;
}

.properties h3{
    margin-bottom:20px;
    color:#38bdf8;
}

.properties label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    color:#cbd5e1;
}

.properties input,
.properties select{
    width:100%;
    padding:9px;
    border-radius:6px;
    border:1px solid #475569;
    background:#1e293b;
    color:white;
}

.info{
    margin-top:25px;
    padding:12px;
    background:#1e293b;
    border-radius:8px;
    color:#94a3b8;
    font-size:13px;
    line-height:1.6;
}

/* MOBILE */

@media(max-width:800px){

    body{
        overflow:auto;
    }

    .main{
        height:auto;
        display:block;
    }

    .sidebar{
        display:flex;
        flex-wrap:wrap;
        gap:6px;
    }

    .sidebar h3{
        width:100%;
    }

    .tool{
        width:auto;
        margin:0;
    }

    .workspace{
        height:600px;
    }

    .properties{
        border-left:none;
        border-top:1px solid #334155;
    }
}
</style>
</head>

    </div>

</div>
